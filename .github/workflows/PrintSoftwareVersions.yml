name: Print Software Versions

on:
  push:
    paths:
      - ".github/workflows/PrintSoftwareVersions.yml"
  workflow_dispatch:

jobs:
  PrintSoftwareVersions:
    name: Application Processing Technologies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js for browser-side JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python for AR service
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print JavaScript runtime version
        run: node --version
      - name: Print Python version
        run: python --version
      - name: Install AR service dependencies
        run: python -m pip install "fastapi==0.115.6" "opencv-contrib-python-headless==4.10.0.84"
      - name: Print FastAPI and OpenCV versions
        run: |
          python -c "import fastapi, cv2; print('FastAPI:', fastapi.__version__); print('OpenCV ArUco:', cv2.__version__)"

  PrintDBMSVersions:
    name: MongoDB Version (Methodological Fallback)
    needs: [PrintSoftwareVersions]
    runs-on: ubuntu-latest
    steps:
      - name: Print MongoDB server version using official Docker image
        run: docker run --rm mongo:7.0 mongod --version
